name: Dev API Server Static Checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: ${{ github.workflow }}-pr-staticcheck-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup-composite
      - id: run-dev-api-server-checks
        run: |
          pnpm nx run @io-app/dev-api-server:generate
          pnpm nx run @io-app/dev-api-server:tsc-noemit
          pnpm nx run @io-app/dev-api-server:lint
          pnpm nx run @io-app/dev-api-server:prettier:check
          pnpm nx run @io-app/dev-api-server:test:ci
      - id: coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
