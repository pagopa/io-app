name: Dev API Server Static Checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: ${{ github.workflow }}-pr-staticcheck-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup-composite
      - name: Sets the base and head SHAs required for `nx affected` command
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - id: run-dev-api-server-affected-checks
        run: |
          pnpm nx affected -t generate --projects=@io-app/dev-api-server
          pnpm nx affected -t tsc-noemit --projects=@io-app/dev-api-server
          pnpm nx affected -t lint --projects=@io-app/dev-api-server
          pnpm nx affected -t prettier:check --projects=@io-app/dev-api-server
          pnpm nx affected -t test:ci --projects=@io-app/dev-api-server
      - id: coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
