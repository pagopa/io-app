name: Update Lokalise snapshots

on:
  pull_request:
    types:
      - opened
    paths:
      - 'apps/main-app/locales/**'

permissions:
  contents: write

jobs:
  update-snapshots:
    if: ${{ startsWith(github.head_ref, 'lok_master_') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Update snapshots
        run: pnpm nx run main-app:test --configuration=ci --updateSnapshot

      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- '**/__snapshots__/*.snap'; then
            echo "No snapshot changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/__snapshots__/*.snap'
          git commit -m "chore: update snapshots for Lokalise translations" --no-verify
          git push origin "HEAD:${{ github.head_ref }}"