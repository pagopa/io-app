pre-commit:
  piped: true
  jobs:
    - name: format staged files
      # Without the flag, oxfmt fails when every staged file is ignored (e.g. only CHANGELOG.md)
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,yml,yaml,md,html}"
      stage_fixed: true

    # Runs from the repo root: oxlint picks each file's nearest .oxlintrc.jsonc,
    # with the root-only options (typeAware, ...) from the root config
    - name: oxlint staged files
      run: pnpm oxlint --fix {staged_files}
      glob: "*.{ts,tsx}"
      stage_fixed: true

    # Runs after oxlint: covers the rules oxlint does not run yet
    - name: eslint staged files
      run: pnpm eslint --fix {staged_files}
      glob: "*.{ts,tsx}"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: validate affected projects
      run: pnpm nx affected --targets=lint,oxlint,tsc-noemit --base=origin/master --head=HEAD --nx-bail

    - name: check pushed files formatting
      run: pnpm oxfmt --check --no-error-on-unmatched-pattern {push_files}
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,yml,yaml,md,html}"
