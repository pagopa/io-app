appId: it.pagopa.app.io
name: Local SPID login and inbox message
---
- runScript: seed-message.js
- runFlow: shared/login.yaml
- tapOn:
    id: wrapped_message_list_item_.*
    text: ${".*" + output.subject + ".*"}
- assertVisible:
    id: message-header-subject
    text: ${output.subject}
- assertVisible:
    text: ${output.sender}
- scrollUntilVisible:
    element:
      text: ${".*" + output.body + ".*"}
    direction: DOWN
