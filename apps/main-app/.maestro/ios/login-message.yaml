appId: it.pagopa.app.io
name: Local SPID login and inbox message
---
- runScript: seed-message.js
- runFlow: shared/login.yaml
- runFlow: shared/open-message.yaml
- assertVisible:
    text: ${output.sender}
- scrollUntilVisible:
    element:
      text: ${".*" + output.body + ".*"}
    direction: DOWN
