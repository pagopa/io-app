appId: it.pagopa.app.io
name: Already paid notice cannot be paid again
---
- runScript: paid-message.js
- runFlow: shared/login.yaml
- runFlow: shared/open-message.yaml
- scrollUntilVisible:
    element:
      text: ".*Pagato.*"
    direction: DOWN
- assertNotVisible: Paga
- assertNotVisible:
    id: wallet-payment-detail-make-payment-button
