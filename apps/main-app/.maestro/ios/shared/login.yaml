appId: it.pagopa.app.io
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: authenticate.yaml
- assertVisible: Non condividere
- waitForAnimationToEnd
- tapOn: Non condividere
- tapOn: Conferma
- extendedWaitUntil:
    visible:
      id: pin-creation-screen
    timeout: 30000
- repeat:
    times: 2
    commands:
      - runFlow: pin.yaml
- assertVisible:
    id: not-enrolled-biometric-confirm
- waitForAnimationToEnd
- tapOn:
    id: not-enrolled-biometric-confirm
- tapOn:
    text: Consenti
    optional: true
- tapOn:
    id: sendEngagementOnFirstAppOpenSecondaryActionID
    optional: true
- tapOn:
    id: sendDismissalID
    optional: true
- extendedWaitUntil:
    visible:
      id: message_list_inbox
    timeout: 30000
