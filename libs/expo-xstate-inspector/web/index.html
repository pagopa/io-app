<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XState inspector</title>
    <!-- Absolute paths: Expo serves this page without a trailing slash. -->
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/layout.css"
    />
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/components.css"
    />
    <script
      type="module"
      src="/_expo/plugins/@io-app/expo-xstate-inspector/scripts/main.js"
    ></script>
  </head>
  <body>
    <main id="diagram">Waiting for the app…</main>
    <div
      id="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panel"
    ></div>
    <section id="panel">
      <nav id="tabs" role="tablist">
        <button role="tab" aria-controls="state-tab" aria-selected="true">
          State
        </button>
        <button role="tab" aria-controls="events-tab" aria-selected="false">
          Events
        </button>
        <button role="tab" aria-controls="actors-tab" aria-selected="false">
          Actors
        </button>
      </nav>
      <div id="state-tab" role="tabpanel">
        <pre id="state"></pre>
        <details>
          <summary>Context</summary>
          <pre id="context"></pre>
        </details>
      </div>
      <div id="events-tab" role="tabpanel" hidden>
        <ol id="events"></ol>
      </div>
      <div id="actors-tab" role="tabpanel" hidden>
        <nav id="actors"></nav>
      </div>
    </section>
  </body>
</html>
