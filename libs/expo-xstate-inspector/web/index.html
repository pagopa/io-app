<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XState inspector</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr 360px;
        font:
          13px system-ui,
          sans-serif;
      }
      aside,
      main,
      section {
        overflow: auto;
        padding: 8px;
      }
      aside,
      section {
        background: #f6f6f6;
      }
      button {
        all: unset;
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #e6e6e6;
      }
      button[aria-current="true"] {
        background: #d6e4ff;
      }
      button.stopped {
        opacity: 0.5;
      }
      #diagram svg {
        max-width: none !important;
      }
      li {
        padding: 2px 0;
        border-bottom: 1px solid #e6e6e6;
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
      ol {
        margin: 0;
        padding-left: 0;
        list-style: none;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
      }
      h3 {
        margin: 8px 0 4px;
      }
    </style>
  </head>
  <body>
    <aside>
      <h3>Machines</h3>
      <nav id="actors"></nav>
    </aside>
    <main id="diagram">Waiting for the app…</main>
    <section>
      <h3>State</h3>
      <pre id="state"></pre>
      <details>
        <summary>Context</summary>
        <pre id="context"></pre>
      </details>
      <h3>Events</h3>
      <ol id="events"></ol>
    </section>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs";

      mermaid.initialize({
        startOnLoad: false,
        theme: "neutral",
        securityLevel: "strict"
      });

      const PLUGIN = "expo-xstate-inspector";
      const devServer =
        new URLSearchParams(location.search).get("devServer") || location.host;
      const ws = new WebSocket(
        `${location.protocol === "https:" ? "wss" : "ws"}://${devServer}/expo-dev-plugins/broadcast`
      );
      ws.binaryType = "arraybuffer";
      const browserClientId = Date.now().toString();
      const actors = new Map();
      let selected;
      // Follows the newest machine until the user picks one.
      let pinned = false;

      const send = message => ws.send(JSON.stringify(message));

      // See @expo/devtools MessageFramePacker: plain objects are JSON strings, other payloads are binary frames.
      const unpack = data => {
        if (typeof data === "string") return JSON.parse(data);
        const view = new DataView(data);
        const keyLength = view.getUint32(0);
        const decoder = new TextDecoder();
        const messageKey = JSON.parse(
          decoder.decode(data.slice(4, 4 + keyLength))
        );
        const isObject = view.getUint8(4 + keyLength) === 6;
        return {
          messageKey,
          payload: isObject
            ? JSON.parse(decoder.decode(data.slice(5 + keyLength)))
            : undefined
        };
      };

      const nodeId = path =>
        path.length ? "s_" + path.join("__").replace(/\W/g, "_") : "root";
      const text = value => String(value).replace(/[:;#{}"]/g, " ");
      const toArray = value =>
        value === undefined ? [] : Array.isArray(value) ? value : [value];
      const name = value => (typeof value === "string" ? value : value?.type);

      const toMermaid = (root, activeValue) => {
        const declarations = [];
        const edges = [];
        const ids = { [root.id]: [] };
        const collectIds = (node, path) =>
          Object.entries(node.states ?? {}).forEach(([key, child]) => {
            if (child.id) ids[child.id] = [...path, key];
            collectIds(child, [...path, key]);
          });
        collectIds(root, []);

        const resolve = (target, path) => {
          if (target.startsWith("#")) {
            const [id, ...rest] = target.slice(1).split(".");
            return ids[id] && [...ids[id], ...rest];
          }
          return target.startsWith(".")
            ? [...path, ...target.slice(1).split(".")]
            : [...path.slice(0, -1), ...target.split(".")];
        };

        const addEdges = (path, transitions, label) =>
          toArray(transitions).forEach(transition => {
            const { target, guard } =
              typeof transition === "string"
                ? { target: transition }
                : transition;
            toArray(target).forEach(t => {
              const to = resolve(t, path);
              const guardLabel = guard ? ` [${name(guard)}]` : "";
              if (to)
                edges.push(
                  `${nodeId(path)} --> ${nodeId(to)} : ${text(label + guardLabel)}`
                );
            });
          });

        const walk = (node, path, indent) => {
          const children = Object.entries(node.states ?? {});
          const initial = name(node.initial) ?? node.initial?.target;
          const lines = [];
          children.forEach(([key, child], index) => {
            const childPath = [...path, key];
            const id = nodeId(childPath);
            if (node.type === "parallel" && index > 0)
              lines.push(`${indent}--`);
            lines.push(`${indent}state "${text(key)}" as ${id}`);
            if (child.states) {
              lines.push(
                `${indent}state ${id} {`,
                ...walk(child, childPath, indent + "  "),
                `${indent}}`
              );
            }
            if (child.type === "final") lines.push(`${indent}${id} --> [*]`);
            Object.entries(child.on ?? {}).forEach(([event, transitions]) =>
              addEdges(childPath, transitions, event)
            );
            Object.entries(child.after ?? {}).forEach(([delay, transitions]) =>
              addEdges(childPath, transitions, `after ${delay}`)
            );
            addEdges(childPath, child.always, "always");
            addEdges(childPath, child.onDone, "onDone");
            toArray(child.invoke).forEach(invoke => {
              addEdges(
                childPath,
                invoke.onDone,
                `done ${name(invoke.src) ?? ""}`
              );
              addEdges(
                childPath,
                invoke.onError,
                `error ${name(invoke.src) ?? ""}`
              );
            });
          });
          if (initial && node.type !== "parallel")
            lines.unshift(
              `${indent}[*] --> ${nodeId([...path, ...initial.split(".")])}`
            );
          return lines;
        };

        const activeLeaves = [];
        const activeParents = [];
        const collectActive = (value, path) =>
          typeof value === "string"
            ? activeLeaves.push([...path, value])
            : Object.entries(value ?? {}).forEach(([key, child]) => {
                activeParents.push([...path, key]);
                collectActive(child, [...path, key]);
              });
        collectActive(activeValue, []);

        declarations.push(...walk(root, [], "  "));
        return [
          "stateDiagram-v2",
          ...declarations,
          ...edges.map(edge => "  " + edge),
          "  classDef active fill:#ffe58f,stroke:#d48806,stroke-width:3px",
          "  classDef activeParent stroke:#d48806,stroke-width:3px",
          ...(activeLeaves.length
            ? [`  class ${activeLeaves.map(nodeId).join(",")} active`]
            : []),
          ...(activeParents.length
            ? [`  class ${activeParents.map(nodeId).join(",")} activeParent`]
            : [])
        ].join("\n");
      };

      let renderCount = 0;
      const renderDiagram = async () => {
        const actor = actors.get(selected);
        const container = document.getElementById("diagram");
        if (!actor?.definition?.states)
          return void (container.textContent = "No machine selected.");
        const id = `diagram-${++renderCount}`;
        try {
          const { svg } = await mermaid.render(
            id,
            toMermaid(actor.definition, actor.snapshot?.value)
          );
          if (id === `diagram-${renderCount}`) container.innerHTML = svg;
        } catch (error) {
          container.textContent = `Could not render the diagram: ${error.message}`;
        }
      };

      const renderSidebar = () => {
        const nav = document.getElementById("actors");
        nav.replaceChildren(
          ...[...actors.entries()]
            .filter(([, actor]) => actor.definition?.states)
            .map(([sessionId, actor]) => {
              const button = document.createElement("button");
              button.textContent = `${actor.name} (${sessionId})`;
              button.ariaCurrent = String(sessionId === selected);
              button.className =
                actor.snapshot?.status === "active" ? "" : "stopped";
              button.onclick = () => {
                pinned = true;
                select(sessionId);
              };
              return button;
            })
        );
      };

      const renderDetails = () => {
        const actor = actors.get(selected);
        document.getElementById("state").textContent =
          JSON.stringify(actor?.snapshot?.value, null, 2) ?? "";
        document.getElementById("context").textContent =
          JSON.stringify(actor?.snapshot?.context, null, 2) ?? "";
        document.getElementById("events").replaceChildren(
          ...(actor?.events ?? []).map(({ time, event }) => {
            const item = document.createElement("li");
            item.textContent = `${time} ${event.type}`;
            item.title = JSON.stringify(event, null, 2);
            return item;
          })
        );
      };

      const select = sessionId => {
        selected = sessionId;
        renderSidebar();
        renderDetails();
        renderDiagram();
      };

      const handle = (method, payload) => {
        const actor = actors.get(payload.sessionId) ?? { events: [] };
        actors.set(payload.sessionId, actor);
        if (method === "actor") {
          actor.name = payload.name;
          actor.definition = payload.definition;
          actor.snapshot = payload.snapshot;
        } else if (method === "snapshot") {
          actor.snapshot = payload.snapshot;
        } else if (method === "event") {
          actor.events.unshift({
            time: new Date().toLocaleTimeString(),
            event: payload.event
          });
          actor.events.length = Math.min(actor.events.length, 200);
        }
        if (method === "actor" && actor.definition?.states && !pinned)
          return select(payload.sessionId);
        if (payload.sessionId !== selected) return renderSidebar();
        renderSidebar();
        renderDetails();
        if (method !== "event") renderDiagram();
      };

      ws.onopen = () => {
        send({
          protocolVersion: 1,
          pluginName: PLUGIN,
          method: "handshake",
          browserClientId,
          __isHandshakeMessages: true
        });
        // Asks the app to replay its running actors.
        send({
          messageKey: { pluginName: PLUGIN, method: "connected" },
          payload: {}
        });
      };

      ws.onmessage = ({ data }) => {
        const message = unpack(data);
        if (message.__isHandshakeMessages) {
          if (
            message.method === "terminateBrowserClient" &&
            message.browserClientId === browserClientId
          )
            ws.close();
          return;
        }
        const { messageKey, payload } = message;
        if (payload?.sessionId && messageKey?.pluginName === PLUGIN)
          handle(messageKey.method, payload);
      };

      ws.onclose = () =>
        (document.getElementById("diagram").textContent =
          "Disconnected. Reload the page to reconnect.");
    </script>
  </body>
</html>
