<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XState inspector</title>
    <link
      rel="icon"
      type="image/png"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/favicon.png"
    />
    <!-- Absolute paths: Expo serves this page without a trailing slash. -->
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/layout.css"
    />
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/components.css"
    />
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/jsonTree.css"
    />
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/table.css"
    />
    <link
      rel="stylesheet"
      href="/_expo/plugins/@io-app/expo-xstate-inspector/styles/diagram.css"
    />
    <script
      type="module"
      src="/_expo/plugins/@io-app/expo-xstate-inspector/scripts/main.js"
    ></script>
  </head>
  <body>
    <aside>
      <h3>Machines</h3>
      <nav id="actors"></nav>
    </aside>
    <main id="diagram">
      <div id="diagram-canvas">Waiting for the app…</div>
      <div id="zoom-controls" class="toolbar" role="toolbar" aria-label="Zoom">
        <button data-zoom="out" title="Zoom out" aria-label="Zoom out">
          −
        </button>
        <button data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
        <button data-zoom="fit" title="Fit (double-click)">Fit</button>
        <button
          data-zoom="follow"
          aria-pressed="false"
          title="Keep the active state centred. Zoom still works, panning does not."
        >
          Follow
        </button>
      </div>
      <aside
        id="state-details"
        aria-label="State details"
        aria-live="polite"
        data-no-pan
        hidden
      ></aside>
    </main>
    <div
      id="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panel"
    ></div>
    <section id="panel">
      <nav id="tabs" role="tablist">
        <button role="tab" aria-controls="state-tab" aria-selected="true">
          State
        </button>
        <button role="tab" aria-controls="context-tab" aria-selected="false">
          Context
        </button>
        <button role="tab" aria-controls="events-tab" aria-selected="false">
          Events
        </button>
        <button
          role="tab"
          aria-controls="child-actors-tab"
          aria-selected="false"
        >
          Actors
        </button>
      </nav>
      <div id="state-tab" role="tabpanel">
        <div id="state"></div>
      </div>
      <div id="context-tab" role="tabpanel" hidden>
        <div id="context"></div>
      </div>
      <div id="events-tab" class="table-panel" role="tabpanel" hidden>
        <table class="data-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Event</th>
              <th>Payload</th>
            </tr>
          </thead>
          <tbody id="events"></tbody>
        </table>
      </div>
      <div id="child-actors-tab" class="table-panel" role="tabpanel" hidden>
        <table class="data-table">
          <thead>
            <tr>
              <th>Started</th>
              <th>Actor</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="child-actors"></tbody>
        </table>
      </div>
    </section>
    <div id="mermaid-sandbox" aria-hidden="true"></div>
  </body>
</html>
